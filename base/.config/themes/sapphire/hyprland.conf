# ────────────────────────────────────────────────────────────
# Custom Theme for Hyprland
# Made with Omarchist
# ────────────────────────────────────────────────────────────

$activeBorderColor   = rgba(d7ebe9ee) rgba(f2c8cbee) 45deg
# Inactive border: muted slate from colors.toml color8 (#51688E), translucent
$inactiveBorderColor = rgba(51688e99)

general {
    col.active_border = $activeBorderColor
    border_size = 2
    gaps_in = 3
    gaps_out = 3
}


group {
    col.border_active = $activeBorderColor
    col.border_inactive = $inactiveBorderColor
    col.border_locked_active = $activeBorderColor
    col.border_locked_inactive = $inactiveBorderColor

    groupbar {
        font_size = 12
        font_family = monospace
        font_weight_active = ultraheavy
        font_weight_inactive = normal

        indicator_height = 0
        indicator_gap = 5
        height = 22
        gaps_in = 5
        gaps_out = 0

        # Tab colors taken straight from colors.toml
        col.active = rgba(f7c3c6ff)          # active_tab_background / accent (#f7c3c6)
        col.inactive = rgba(51688e55)        # color8 muted slate (#51688E), faint
        text_color = rgb(060d1f)             # background (#060d1f) -> dark text on the pink tab
        text_color_inactive = rgba(e0f7faaa) # foreground (#E0F7FA), dimmed

        gradients = true
        gradient_rounding = 0
        gradient_round_only_edges = false
    }
}

decoration {
    shadow {
        enabled = yes
        render_power = 4
        range = 16
        color = rgba(5, 5, 5, .7)
    }

    blur {
        enabled = true
        size = 3
        passes = 2
    }
}
