# Spectra theme for tmux

# Status bar
set -g status-style "bg=#1a1b1e,fg=#eaeaef"
set -g status-left-style "bg=#1a1b1e,fg=#8edb73"
set -g status-right-style "bg=#1a1b1e,fg=#f7c553"

# Window status
set -g window-status-style "bg=#1a1b1e,fg=#505258"
set -g window-status-current-style "bg=#2b2d31,fg=#eaeaef,bold"
set -g window-status-activity-style "bg=#1a1b1e,fg=#ef5d67"

# Pane borders
set -g pane-border-style "fg=#505258"
set -g pane-active-border-style "fg=#7ca5ff"

# Message styling
set -g message-style "bg=#1a1b1e,fg=#f7c553"
set -g message-command-style "bg=#1a1b1e,fg=#f7c553"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#2b2d31,fg=#eaeaef"

# Clock
set -g clock-mode-colour "#7dd8d3"
