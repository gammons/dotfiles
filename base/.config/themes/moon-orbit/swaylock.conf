# Moon Orbit theme for swaylock

daemonize
show-failed-attempts

# Background
color=2d2940
image=~/.config/themes/current/background
scaling=fill

# Indicator
indicator
indicator-radius=120
indicator-thickness=10

# Ring colors
ring-color=684764
key-hl-color=a09bd3
bs-hl-color=C0685F

# Inside colors
inside-color=2d2940
text-color=6096fd

# Separator color
separator-color=00000000

# Verification colors
inside-ver-color=7c79a5
ring-ver-color=7c79a5
text-ver-color=2d2940

# Wrong password colors
inside-wrong-color=C0685F
ring-wrong-color=ee897d
text-wrong-color=2d2940

# Clear colors
inside-clear-color=fca766
ring-clear-color=ffd46b
text-clear-color=2d2940

# Caps lock colors
caps-lock-key-hl-color=00ffd2
caps-lock-bs-hl-color=ee897d

font="monospace"
font-size=24
effect-blur=10x3

# Clock display
clock
timestr=%H:%M
datestr=%A, %B %d

# Vignette effect
effect-vignette=0.5:0.5
