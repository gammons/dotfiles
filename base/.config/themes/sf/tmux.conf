# SparkFabrik (sf) theme for tmux

# Status bar
set -g status-style "bg=#031527,fg=#ffffff"
set -g status-left-style "bg=#031527,fg=#40c6cf"
set -g status-right-style "bg=#031527,fg=#f7ad2c"

# Window status
set -g window-status-style "bg=#031527,fg=#0c335a"
set -g window-status-current-style "bg=#eb0000,fg=#ffffff,bold"
set -g window-status-activity-style "bg=#031527,fg=#f36931"

# Pane borders
set -g pane-border-style "fg=#0c335a"
set -g pane-active-border-style "fg=#eb0000"

# Message styling
set -g message-style "bg=#031527,fg=#f7ad2c"
set -g message-command-style "bg=#031527,fg=#f7ad2c"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#0c335a,fg=#ffffff"

# Clock
set -g clock-mode-colour "#40c6cf"
