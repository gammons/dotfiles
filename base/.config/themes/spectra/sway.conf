# Spectra theme for Sway

# Color definitions
set $bg #1a1b1e
set $fg #eaeaef
set $inactive #3a3a3a
set $dim #505258
set $red #ef5d67
set $green #8edb73
set $yellow #f7c553
set $blue #7ca5ff
set $magenta #e29ef3
set $cyan #7dd8d3

# Window colors           border      bg          text        indicator   child_border
client.focused            $blue       $bg         $fg         $cyan       $blue
client.focused_inactive   $inactive   $bg         $fg         $inactive   $inactive
client.unfocused          $inactive   $bg         $fg         $inactive   $inactive
client.urgent             $red        $bg         $fg         $red        $red
client.placeholder        $inactive   $bg         $fg         $inactive   $inactive
client.background         $bg

# SwayFX-specific settings
shadows enable
shadows_on_csd enable
shadow_blur_radius 25
shadow_color #00000055

blur enable
blur_passes 3
blur_radius 4
