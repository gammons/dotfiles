# Default mic preference: Scarlett Mic1 when docked, built-in mic otherwise,
# never the (undetectable, usually empty) headphone-jack mic.
#
# Framework 13 AMD Ryzen AI 300: "Digital Microphone" (HiFi__Mic1, hw:acppdmmach)
# is a phantom device the BIOS advertises but isn't wired; it always returns a
# constant -32768. The real built-in mic is the ALC285 "Internal Stereo
# Microphone" (HiFi__Mic2), which only exists in card profiles containing Mic2,
# e.g. "HiFi (Mic1, Mic2, Speaker)".
# https://github.com/FrameworkComputer/SoftwareFirmwareIssueTracker/issues/166
#
# WirePlumber adds +30000 to whichever mic was last picked as default, so these
# priorities are deliberately larger than that bonus:
#   Scarlett 64000 > built-in last-picked (30000 + 33000)
#   built-in 33000 > jack or Bluetooth last-picked (30000 + ~2000)
# Picking a specific mic inside an app (e.g. Chrome's mic picker) still works.

monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_input.usb-Focusrite_Scarlett_2i2_.*HiFi__Mic1__source" } ]
    actions = { update-props = { priority.session = 64000 } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_c1_00.6.HiFi__Mic2__source" } ]
    actions = { update-props = { priority.session = 33000 } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_c1_00.6.HiFi__Headset__source" } ]
    actions = { update-props = { priority.session = 100 } }
  }
  {
    matches = [ { node.name = "alsa_input.pci-0000_c1_00.6.HiFi__Mic1__source" } ]
    actions = { update-props = { node.disabled = true } }
  }
]
