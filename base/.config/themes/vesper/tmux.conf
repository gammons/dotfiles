# Vesper theme for tmux

# Status bar
set -g status-style "bg=#101010,fg=#d4d4d4"
set -g status-left-style "bg=#101010,fg=#99FFE4"
set -g status-right-style "bg=#101010,fg=#FFC799"

# Window status
set -g window-status-style "bg=#101010,fg=#505050"
set -g window-status-current-style "bg=#232323,fg=#d4d4d4,bold"
set -g window-status-activity-style "bg=#101010,fg=#FF8080"

# Pane borders
set -g pane-border-style "fg=#3e3e3e"
set -g pane-active-border-style "fg=#FFC799"

# Message styling
set -g message-style "bg=#101010,fg=#FFC799"
set -g message-command-style "bg=#101010,fg=#FFC799"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#232323,fg=#d4d4d4"

# Clock
set -g clock-mode-colour "#99FFE4"
