# Snow Black theme for tmux

# Status bar
set -g status-style "bg=#000000,fg=#c1c1c1"
set -g status-left-style "bg=#000000,fg=#5f8787"
set -g status-right-style "bg=#000000,fg=#aaaaaa"

# Window status
set -g window-status-style "bg=#000000,fg=#333333"
set -g window-status-current-style "bg=#1a1a1a,fg=#ffffff,bold"
set -g window-status-activity-style "bg=#000000,fg=#dd9999"

# Pane borders
set -g pane-border-style "fg=#333333"
set -g pane-active-border-style "fg=#a6a6a6"

# Message styling
set -g message-style "bg=#000000,fg=#dd9999"
set -g message-command-style "bg=#000000,fg=#dd9999"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#1a1a1a,fg=#ffffff"

# Clock
set -g clock-mode-colour "#5f8787"
