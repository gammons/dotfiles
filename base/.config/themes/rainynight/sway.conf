# Rainy Night theme for Sway

# Color definitions
set $bg #1e1e2e
set $fg #cdd6f4
set $active #303463
set $inactive #1a1b26
set $dim #585b70
set $red #f38ba8
set $blue #89b4fa
set $mauve #cba6f7
set $teal #94e2d5

# Window colors           border      bg          text        indicator   child_border
client.focused            $active     $bg         $fg         $mauve      $active
client.focused_inactive   $inactive   $bg         $dim        $inactive   $inactive
client.unfocused          $inactive   $bg         $dim        $inactive   $inactive
client.urgent             $red        $bg         $bg         $red        $red
client.placeholder        $inactive   $bg         $fg         $inactive   $inactive
client.background         $bg

# SwayFX-specific settings
shadows enable
shadows_on_csd enable
shadow_blur_radius 15
shadow_color #00000099

blur enable
blur_passes 4
blur_radius 1
