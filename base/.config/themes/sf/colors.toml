red     = "#eb0000"  # Spark Red
yellow  = "#f7ad2c"  # Spark Yellow
orange  = "#f36931"  # Spark Orange
green   = "#008844"  # Spark Dark Green
cyan    = "#40c6cf"  # Spark Aquamarine
blue    = "#027aca"  # Spark Light Blue
magenta = "#8d1971"  # Spark Dark Purple
