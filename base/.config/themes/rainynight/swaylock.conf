# Rainy Night theme for swaylock

daemonize
show-failed-attempts

# Background
color=1e1e2e
image=~/.config/themes/current/background
scaling=fill

# Indicator
indicator
indicator-radius=120
indicator-thickness=10

# Ring colors
ring-color=585b70
key-hl-color=94e2d5
bs-hl-color=f38ba8

# Inside colors
inside-color=1e1e2e
text-color=cdd6f4

# Separator color
separator-color=00000000

# Verification colors
inside-ver-color=cba6f7
ring-ver-color=cba6f7
text-ver-color=1e1e2e

# Wrong password colors
inside-wrong-color=f38ba8
ring-wrong-color=f38ba8
text-wrong-color=1e1e2e

# Clear colors
inside-clear-color=f9e2af
ring-clear-color=f9e2af
text-clear-color=1e1e2e

# Caps lock colors
caps-lock-key-hl-color=89b4fa
caps-lock-bs-hl-color=f38ba8

font="monospace"
font-size=24
effect-blur=10x3

# Clock display
clock
timestr=%H:%M
datestr=%A, %B %d

# Vignette effect
effect-vignette=0.5:0.5
