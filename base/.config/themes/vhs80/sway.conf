# vhs80 theme for Sway

# Color definitions
set $bg #121212
set $fg #d4d4d4
set $active #8B7F2E
set $inactive #606060
set $dim #8a8a8d
set $red #862020
set $green #277D46
set $amber #A85511
set $gold #C6B441

# Window colors           border      bg          text        indicator   child_border
client.focused            $active     $bg         $fg         $gold       $active
client.focused_inactive   $inactive   $bg         $dim        $inactive   $inactive
client.unfocused          $inactive   $bg         $dim        $inactive   $inactive
client.urgent             $red        $bg         $fg         $red        $red
client.placeholder        $inactive   $bg         $fg         $inactive   $inactive
client.background         $bg

# SwayFX-specific settings
shadows enable
shadows_on_csd enable
shadow_blur_radius 20
shadow_color #000000aa

blur enable
blur_passes 2
blur_radius 5
