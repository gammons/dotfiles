# Rainy Night theme for tmux

# Status bar
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-style "bg=#1e1e2e,fg=#94e2d5"
set -g status-right-style "bg=#1e1e2e,fg=#f9e2af"

# Window status
set -g window-status-style "bg=#1e1e2e,fg=#585b70"
set -g window-status-current-style "bg=#303463,fg=#cdd6f4,bold"
set -g window-status-activity-style "bg=#1e1e2e,fg=#f38ba8"

# Pane borders
set -g pane-border-style "fg=#45475a"
set -g pane-active-border-style "fg=#89b4fa"

# Message styling
set -g message-style "bg=#1e1e2e,fg=#f9e2af"
set -g message-command-style "bg=#1e1e2e,fg=#f9e2af"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#303463,fg=#cdd6f4"

# Clock
set -g clock-mode-colour "#cba6f7"
