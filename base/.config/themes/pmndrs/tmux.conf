# Poimandres (pmndrs) theme for tmux

# Status bar
set -g status-style "bg=#1b1e28,fg=#a6accd"
set -g status-left-style "bg=#1b1e28,fg=#5de4c7"
set -g status-right-style "bg=#1b1e28,fg=#fffac2"

# Window status
set -g window-status-style "bg=#1b1e28,fg=#6c6f93"
set -g window-status-current-style "bg=#2a2e3f,fg=#e4f0fb,bold"
set -g window-status-activity-style "bg=#1b1e28,fg=#d0679d"

# Pane borders
set -g pane-border-style "fg=#6c6f93"
set -g pane-active-border-style "fg=#add7ff"

# Message styling
set -g message-style "bg=#1b1e28,fg=#fffac2"
set -g message-command-style "bg=#1b1e28,fg=#fffac2"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#2a2e3f,fg=#f8f8f2"

# Clock
set -g clock-mode-colour "#5de4c7"
