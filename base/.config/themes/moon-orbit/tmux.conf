# Moon Orbit theme for tmux

# Status bar
set -g status-style "bg=#2d2940,fg=#6096fd"
set -g status-left-style "bg=#2d2940,fg=#a19bd4"
set -g status-right-style "bg=#2d2940,fg=#fca766"

# Window status
set -g window-status-style "bg=#2d2940,fg=#684764"
set -g window-status-current-style "bg=#423e53,fg=#88b0fe,bold"
set -g window-status-activity-style "bg=#2d2940,fg=#C0685F"

# Pane borders
set -g pane-border-style "fg=#684764"
set -g pane-active-border-style "fg=#7b79a4"

# Message styling
set -g message-style "bg=#2d2940,fg=#fca766"
set -g message-command-style "bg=#2d2940,fg=#fca766"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#423e53,fg=#88b0fe"

# Clock
set -g clock-mode-colour "#00ffd2"
