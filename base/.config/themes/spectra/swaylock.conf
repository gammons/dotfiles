# Spectra theme for swaylock

daemonize
show-failed-attempts

# Background
color=1a1b1e
image=~/.config/themes/current/background
scaling=fill

# Indicator
indicator
indicator-radius=120
indicator-thickness=10

# Ring colors
ring-color=505258
key-hl-color=8edb73
bs-hl-color=ef5d67

# Inside colors
inside-color=1a1b1e
text-color=eaeaef

# Separator color
separator-color=00000000

# Verification colors
inside-ver-color=7ca5ff
ring-ver-color=7ca5ff
text-ver-color=1a1b1e

# Wrong password colors
inside-wrong-color=ef5d67
ring-wrong-color=ef5d67
text-wrong-color=f8f8fa

# Clear colors
inside-clear-color=f7c553
ring-clear-color=f7c553
text-clear-color=1a1b1e

# Caps lock colors
caps-lock-key-hl-color=7dd8d3
caps-lock-bs-hl-color=ef5d67

font="monospace"
font-size=24
effect-blur=10x3

# Clock display
clock
timestr=%H:%M
datestr=%A, %B %d

# Vignette effect
effect-vignette=0.5:0.5
