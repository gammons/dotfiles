# vhs80 theme for tmux

# Status bar
set -g status-style "bg=#121212,fg=#d4d4d4"
set -g status-left-style "bg=#121212,fg=#5BB775"
set -g status-right-style "bg=#121212,fg=#C6B441"

# Window status
set -g window-status-style "bg=#121212,fg=#8a8a8d"
set -g window-status-current-style "bg=#333333,fg=#eaeaea,bold"
set -g window-status-activity-style "bg=#121212,fg=#C73838"

# Pane borders
set -g pane-border-style "fg=#606060"
set -g pane-active-border-style "fg=#8B7F2E"

# Message styling
set -g message-style "bg=#121212,fg=#E07924"
set -g message-command-style "bg=#121212,fg=#E07924"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#333333,fg=#eaeaea"

# Clock
set -g clock-mode-colour "#C6B441"
