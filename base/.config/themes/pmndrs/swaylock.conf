# Poimandres (pmndrs) theme for swaylock

daemonize
show-failed-attempts

# Background
color=1b1e28
image=~/.config/themes/current/background
scaling=fill

# Indicator
indicator
indicator-radius=120
indicator-thickness=10

# Ring colors
ring-color=6c6f93
key-hl-color=5de4c7
bs-hl-color=d0679d

# Inside colors
inside-color=1b1e28
text-color=a6accd

# Separator color
separator-color=00000000

# Verification colors
inside-ver-color=add7ff
ring-ver-color=add7ff
text-ver-color=1b1e28

# Wrong password colors
inside-wrong-color=d0679d
ring-wrong-color=d0679d
text-wrong-color=1b1e28

# Clear colors
inside-clear-color=fffac2
ring-clear-color=fffac2
text-clear-color=1b1e28

# Caps lock colors
caps-lock-key-hl-color=89ddff
caps-lock-bs-hl-color=d0679d

font="monospace"
font-size=24
effect-blur=10x3

# Clock display
clock
timestr=%H:%M
datestr=%A, %B %d

# Vignette effect
effect-vignette=0.5:0.5
