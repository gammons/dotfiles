# SparkFabrik (sf) theme for swaylock

daemonize
show-failed-attempts

# Background
color=031527
image=~/.config/themes/current/background
scaling=fill

# Indicator
indicator
indicator-radius=120
indicator-thickness=10

# Ring colors
ring-color=0c335a
key-hl-color=40c6cf
bs-hl-color=eb0000

# Inside colors
inside-color=031527
text-color=ffffff

# Separator color
separator-color=00000000

# Verification colors
inside-ver-color=027aca
ring-ver-color=027aca
text-ver-color=ffffff

# Wrong password colors
inside-wrong-color=eb0000
ring-wrong-color=eb0000
text-wrong-color=ffffff

# Clear colors
inside-clear-color=f7ad2c
ring-clear-color=f7ad2c
text-clear-color=031527

# Caps lock colors
caps-lock-key-hl-color=68d366
caps-lock-bs-hl-color=f36931

font="monospace"
font-size=24
effect-blur=10x3

# Clock display
clock
timestr=%H:%M
datestr=%A, %B %d

# Vignette effect
effect-vignette=0.5:0.5
