# Poimandres (pmndrs) theme for Sway

# Color definitions
set $bg #1b1e28
set $fg #a6accd
set $inactive #252b37
set $dim #6c6f93
set $accent #add7ff
set $mint #5de4c7
set $pink #d0679d
set $blue #89ddff

# Window colors           border      bg          text        indicator   child_border
client.focused            $accent     $bg         $fg         $mint       $accent
client.focused_inactive   $inactive   $bg         $dim        $inactive   $inactive
client.unfocused          $inactive   $bg         $dim        $inactive   $inactive
client.urgent             $pink       $bg         $bg         $pink       $pink
client.placeholder        $inactive   $bg         $fg         $inactive   $inactive
client.background         $bg

# SwayFX-specific settings
shadows enable
shadows_on_csd enable
shadow_blur_radius 20
shadow_color #00000088

blur enable
blur_passes 2
blur_radius 5
