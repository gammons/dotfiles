# Vesper theme for swaylock

daemonize
show-failed-attempts

# Background
color=101010
image=~/.config/themes/current/background
scaling=fill

# Indicator
indicator
indicator-radius=120
indicator-thickness=10

# Ring colors
ring-color=505050
key-hl-color=99FFE4
bs-hl-color=FF8080

# Inside colors
inside-color=101010
text-color=d4d4d4

# Separator color
separator-color=00000000

# Verification colors
inside-ver-color=99FFE4
ring-ver-color=99FFE4
text-ver-color=101010

# Wrong password colors
inside-wrong-color=FF8080
ring-wrong-color=FF8080
text-wrong-color=101010

# Clear colors
inside-clear-color=FFC799
ring-clear-color=FFC799
text-clear-color=101010

# Caps lock colors
caps-lock-key-hl-color=FFCFA8
caps-lock-bs-hl-color=FF8080

font="monospace"
font-size=24
effect-blur=10x3

# Clock display
clock
timestr=%H:%M
datestr=%A, %B %d

# Vignette effect
effect-vignette=0.5:0.5
