# Sapphire theme for tmux

# Status bar
set -g status-style "bg=#060d1f,fg=#E0F7FA"
set -g status-left-style "bg=#060d1f,fg=#85cec4"
set -g status-right-style "bg=#060d1f,fg=#f7c3c6"

# Window status
set -g window-status-style "bg=#060d1f,fg=#51688E"
set -g window-status-current-style "bg=#132241,fg=#E0F7FA,bold"
set -g window-status-activity-style "bg=#060d1f,fg=#e95c4b"

# Pane borders
set -g pane-border-style "fg=#51688E"
set -g pane-active-border-style "fg=#d7ebe9"

# Message styling
set -g message-style "bg=#060d1f,fg=#f7c3c6"
set -g message-command-style "bg=#060d1f,fg=#f7c3c6"

# Mode styling (copy mode, etc.)
set -g mode-style "bg=#132241,fg=#E0F7FA"

# Clock
set -g clock-mode-colour "#6488EA"
