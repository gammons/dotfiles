# Snow Black theme for Sway

# Color definitions
set $bg #000000
set $fg #ffffff
set $active #a6a6a6
set $inactive #101010
set $dim #333333
set $teal #5f8787
set $rose #dd9999
set $clay #a06666

# Window colors           border      bg          text        indicator   child_border
client.focused            $active     $bg         $fg         $teal       $active
client.focused_inactive   $inactive   $bg         $dim        $inactive   $inactive
client.unfocused          $inactive   $bg         $dim        $inactive   $inactive
client.urgent             $clay       $bg         $fg         $clay       $clay
client.placeholder        $inactive   $bg         $fg         $inactive   $inactive
client.background         $bg

# SwayFX-specific settings
shadows enable
shadows_on_csd enable
shadow_blur_radius 16
shadow_color #000000cc

blur enable
blur_passes 2
blur_radius 2
