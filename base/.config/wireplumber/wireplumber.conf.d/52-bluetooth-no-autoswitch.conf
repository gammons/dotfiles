# Keep Bluetooth headsets (Pixel Buds) in A2DP stereo. With autoswitch on, any
# app opening a mic drops them to mono HSP/HFP ("AM radio" quality). Calls use
# the laptop or Scarlett mic instead (see 51-mic-preference.conf).

wireplumber.settings = {
  bluetooth.autoswitch-to-headset-profile = false
}
