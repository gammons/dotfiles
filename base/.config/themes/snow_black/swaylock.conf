# Snow Black theme for swaylock

daemonize
show-failed-attempts

# Background
color=000000
image=~/.config/themes/current/background
scaling=fill

# Indicator
indicator
indicator-radius=120
indicator-thickness=10

# Ring colors
ring-color=333333
key-hl-color=ffffff
bs-hl-color=a06666

# Inside colors
inside-color=000000
text-color=ffffff

# Separator color
separator-color=00000000

# Verification colors
inside-ver-color=5f8787
ring-ver-color=5f8787
text-ver-color=000000

# Wrong password colors
inside-wrong-color=a06666
ring-wrong-color=a06666
text-wrong-color=ffffff

# Clear colors
inside-clear-color=dd9999
ring-clear-color=dd9999
text-clear-color=000000

# Caps lock colors
caps-lock-key-hl-color=aaaaaa
caps-lock-bs-hl-color=a06666

font="monospace"
font-size=24
effect-blur=10x3

# Clock display
clock
timestr=%H:%M
datestr=%A, %B %d

# Vignette effect
effect-vignette=0.5:0.5
